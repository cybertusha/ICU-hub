<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0b111e" />
  <link rel="manifest" href="/manifest.json" />
  <title>ICUGuardian — Central Telemetry & Clinical Surveillance</title>
  <style>
    :root {
      --bg-canvas: #f4f6f9;
      --bg-surface: #ffffff;
      --bg-subtle: #f8fafc;
      --bg-muted: #f1f5f9;
      --bg-hover: #f8fafc;
      --bg-sidebar: #0b111e;
      --text-sidebar: #94a3b8;
      --text-sidebar-active: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --accent-subtle: #e0f2fe;
      --primary-btn: #0f172a;
      --primary-btn-text: #ffffff;

      /* Clinical Acuity Semantics */
      --normal-text: #15803d;
      --normal-bg: #f0fdf4;
      --normal-border: #bbf7d0;
      --normal-dot: #16a34a;

      --warn-text: #b45309;
      --warn-bg: #fffbeb;
      --warn-border: #fde68a;
      --warn-dot: #d97706;

      --crit-text: #b91c1c;
      --crit-bg: #fef2f2;
      --crit-border: #fecaca;
      --crit-dot: #dc2626;
      --row-unack: #fffBEB;

      --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    }

    body.dark-theme {
      --bg-canvas: #070b12;
      --bg-surface: #0d1421;
      --bg-subtle: #111a2b;
      --bg-muted: #172236;
      --bg-hover: #152033;
      --bg-sidebar: #060911;
      --text-primary: #f1f5f9;
      --text-secondary: #cbd5e1;
      --text-muted: #64748b;
      --border: #1e293b;
      --border-strong: #334155;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --accent-subtle: rgba(56, 189, 248, 0.12);
      --primary-btn: #0284c7;
      --primary-btn-text: #ffffff;

      --normal-text: #4ade80;
      --normal-bg: rgba(22, 163, 74, 0.14);
      --normal-border: rgba(34, 197, 94, 0.32);
      --normal-dot: #22c55e;

      --warn-text: #fbbf24;
      --warn-bg: rgba(217, 119, 6, 0.15);
      --warn-border: rgba(245, 158, 11, 0.35);
      --warn-dot: #f59e0b;

      --crit-text: #f87171;
      --crit-bg: rgba(220, 38, 38, 0.16);
      --crit-border: rgba(239, 68, 68, 0.42);
      --crit-dot: #ef4444;
      --row-unack: rgba(245, 158, 11, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background: var(--bg-canvas);
      color: var(--text-primary);
      min-height: 100vh;
      font-size: 13.5px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    .tabular {
      font-variant-numeric: tabular-nums;
      font-family: var(--font-mono);
    }

    /* Authentication View */
    .auth-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      background: var(--bg-canvas);
    }
    @media (max-width: 920px) {
      .auth-shell { grid-template-columns: 1fr; }
      .auth-Hero { display: none !important; }
    }
    .auth-Hero {
      background: #080d18;
      color: #f8fafc;
      padding: 48px 56px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-right: 1px solid #1e293b;
      position: relative;
      overflow: hidden;
    }
    .auth-Hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(56, 189, 248, 0.08) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
    }
    .auth-panel-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      background: var(--bg-surface);
    }
    .auth-box {
      width: 100%;
      max-width: 390px;
    }

    /* Form Controls & Buttons */
    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 5px;
    }
    .input, select, textarea {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      padding: 8px 11px;
      font-size: 13px;
      color: var(--text-primary);
      font-family: inherit;
      outline: none;
      transition: border-color 0.12s, box-shadow 0.12s;
    }
    .input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-subtle);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 7px 13px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border-strong);
      background: var(--bg-surface);
      color: var(--text-primary);
      transition: background 0.12s, border-color 0.12s;
      white-space: nowrap;
    }
    .btn:hover { background: var(--bg-muted); }
    .btn-primary {
      background: var(--primary-btn);
      color: var(--primary-btn-text);
      border-color: var(--primary-btn);
    }
    .btn-primary:hover { opacity: 0.92; background: var(--primary-btn); }
    .btn-danger {
      background: var(--crit-bg);
      color: var(--crit-text);
      border-color: var(--crit-border);
    }
    .btn-danger:hover { background: #fee2e2; }
    .btn-xs { padding: 4px 9px; font-size: 11.5px; border-radius: 5px; }

    /* Application Layout */
    .app-layout {
      display: grid;
      grid-template-columns: 232px 1fr;
      min-height: 100vh;
    }
    @media (max-width: 960px) {
      .app-layout { grid-template-columns: 1fr; }
    }

    /* Dark Clinical Navigation Rail */
    .nav-rail {
      background: var(--bg-sidebar);
      color: var(--text-sidebar);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: sticky;
      top: 0;
      height: 100vh;
      border-right: 1px solid #1e293b;
      user-select: none;
    }
    .rail-brand {
      padding: 16px 16px 14px;
      border-bottom: 1px solid #1e293b;
    }
    .rail-brand-row {
      display: flex;
      align-items: center;
      gap: 9px;
      color: #ffffff;
      font-weight: 700;
      font-size: 14.5px;
      letter-spacing: -0.01em;
    }
    .brand-mark {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: #0284c7;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      flex-shrink: 0;
    }
    .rail-telemetry-status {
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 5px;
      font-size: 11px;
      font-family: var(--font-mono);
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }
    .dot-online { background: #22c55e; box-shadow: 0 0 6px rgba(34, 197, 94, 0.6); }
    .dot-warn { background: #f59e0b; }
    .dot-crit { background: #ef4444; box-shadow: 0 0 8px rgba(239, 68, 68, 0.7); }

    .rail-menu {
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .rail-section-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #475569;
      padding: 8px 10px 4px;
    }
    .rail-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: color 0.12s, background 0.12s;
    }
    .rail-btn-left {
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .rail-btn:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #e2e8f0;
    }
    .rail-btn.active {
      background: rgba(56, 189, 248, 0.14);
      color: #ffffff;
      font-weight: 600;
    }
    .rail-btn.active svg { color: #38bdf8; }
    .rail-count {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
      background: #dc2626;
      color: #ffffff;
    }

    .rail-footer {
      padding: 12px 14px;
      border-top: 1px solid #1e293b;
      background: rgba(0, 0, 0, 0.15);
    }
    .clinician-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .initials-badge {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11.5px;
      font-weight: 700;
      font-family: var(--font-mono);
      flex-shrink: 0;
    }
    .patient-initials {
      width: 30px;
      height: 30px;
      border-radius: 6px;
      background: var(--bg-muted);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      font-family: var(--font-mono);
      flex-shrink: 0;
    }

    /* Workspace Header & Content */
    .workspace {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .top-bar {
      height: 52px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 40;
    }
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-muted);
    }
    .breadcrumb strong {
      color: var(--text-primary);
      font-weight: 600;
    }
    .top-bar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .content-area {
      padding: 20px 24px 36px;
      max-width: 1480px;
      width: 100%;
      margin: 0 auto;
    }

    /* Unified Telemetry Metric Strip (Replaces bloated KPI cards) */
    .metric-strip {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      margin-bottom: 16px;
      overflow: hidden;
    }
    .metric-cell {
      padding: 12px 16px;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .metric-cell:last-child { border-right: none; }
    .metric-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .metric-value {
      font-size: 22px;
      font-weight: 700;
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      margin-top: 4px;
      line-height: 1.1;
    }

    /* Panel / Table Container */
    .surface-panel {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .panel-toolbar {
      padding: 11px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .panel-title {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .segmented-group {
      display: inline-flex;
      background: var(--bg-muted);
      border: 1px solid var(--border);
      padding: 2px;
      border-radius: 6px;
      gap: 2px;
    }
    .seg-btn {
      border: none;
      background: transparent;
      color: var(--text-secondary);
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
    }
    .seg-btn.active {
      background: var(--bg-surface);
      color: var(--text-primary);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
    }

    /* High-Density Clinical Data Table */
    .table-scroll { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      padding: 10px 14px;
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    td {
      padding: 11px 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
      white-space: nowrap;
      font-size: 13px;
    }
    tbody tr:hover { background: var(--bg-hover); }
    tbody tr:last-child td { border-bottom: none; }
    tr.row-critical { border-left: 3px solid var(--crit-dot); }
    tr.row-warning { border-left: 3px solid var(--warn-dot); }
    tr.row-normal { border-left: 3px solid transparent; }
    tr.alert-unack { background: var(--row-unack); }

    /* Clinical Status Pills & Tags */
    .acuity-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      font-family: var(--font-mono);
      letter-spacing: 0.03em;
      border: 1px solid transparent;
    }
    .acuity-normal {
      background: var(--normal-bg);
      color: var(--normal-text);
      border-color: var(--normal-border);
    }
    .acuity-warning {
      background: var(--warn-bg);
      color: var(--warn-text);
      border-color: var(--warn-border);
    }
    .acuity-critical {
      background: var(--crit-bg);
      color: var(--crit-text);
      border-color: var(--crit-border);
    }
    .acuity-offline {
      background: var(--bg-muted);
      color: var(--text-muted);
      border-color: var(--border);
    }
    .mono-tag {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 4px;
      background: var(--bg-muted);
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }
    .vital-cell-num {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 14px;
      font-weight: 700;
    }
    .vital-unit {
      font-size: 10.5px;
      font-weight: 500;
      color: var(--text-muted);
      margin-left: 2px;
    }
    .val-abnormal { color: var(--crit-text); }
    .val-normal { color: var(--text-primary); }

    /* Patient Detail Readout Strip (Hospital Monitor Style) */
    .vital-readout-strip {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      background: #080d18;
      color: #f8fafc;
      border: 1px solid #1e293b;
      border-radius: 8px;
      margin-bottom: 16px;
      overflow: hidden;
    }
    @media (max-width: 900px) {
      .vital-readout-strip { grid-template-columns: repeat(2, 1fr); }
    }
    .readout-tile {
      padding: 12px 16px;
      border-right: 1px solid #1e293b;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .readout-tile:last-child { border-right: none; }
    .readout-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .readout-limits {
      font-family: var(--font-mono);
      font-size: 10px;
      color: #64748b;
    }
    .readout-main {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-top: 6px;
    }
    .readout-number {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 32px;
      font-weight: 800;
      line-height: 1;
    }

    /* Sub-Navigation Underline Bar */
    .subnav-bar {
      display: flex;
      gap: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
      overflow-x: auto;
    }
    .subnav-tab {
      padding: 8px 2px 10px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
    }
    .subnav-tab:hover { color: var(--text-primary); }
    .subnav-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    /* Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #cbd5e1;
      transition: .15s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .15s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--accent); }
    input:checked + .slider:before { transform: translateX(16px); }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(9, 13, 22, 0.65);
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      max-width: 540px;
      width: 100%;
      padding: 22px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      max-height: 90vh;
      overflow-y: auto;
    }

    #toast-container {
      position: fixed;
      bottom: 18px;
      right: 18px;
      z-index: 2000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 380px;
    }
    .toast {
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid #334155;
      border-left: 4px solid #38bdf8;
      border-radius: 6px;
      padding: 11px 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      font-size: 12.5px;
    }
    .toast.critical {
      border-left-color: #ef4444;
      background: #450a0a;
      border-color: #dc2626;
    }
  </style>
</head>
<body>
  <div id="toast-container"></div>
  <div id="app-root"></div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const API_BASE = urlParams.get('api') || localStorage.getItem('icu_cloud_api_url') || (window.location.protocol + '//' + window.location.hostname + ':8000/api');
    const WS_ENDPOINT = urlParams.get('ws') || localStorage.getItem('icu_cloud_ws_url') || ((window.location.protocol === 'https:' ? 'wss://' : 'ws://') + window.location.hostname + ':8000/ws');

    // Crisp 1.5px Stroke Clinical SVG Icon Library (No Emojis)
    const ICONS = {
      pulse: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>`,

    let audioCtx = null;
    function playMedicalAlarm(severity = 'CRITICAL') {
      if (!STATE.soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const vol = (STATE.soundVolume / 100) * 0.22;
        const freqs = severity === 'CRITICAL' ? [880, 987.77, 880, 1174.66] : [659.25, 523.25];
        freqs.forEach((f, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.value = f;
          gain.gain.setValueAtTime(vol, audioCtx.currentTime + idx * 0.16);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.16 + 0.14);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(audioCtx.currentTime + idx * 0.16);
          osc.stop(audioCtx.currentTime + idx * 0.16 + 0.15);
        });
      } catch (e) {}
    }

    function showToast(title, body, severity = 'INFO') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const el = document.createElement('div');
      el.className = 'toast' + (severity === 'CRITICAL' ? ' critical' : '');
      el.innerHTML = `<div style="font-weight:700;margin-bottom:2px;">${title}</div><div style="opacity:0.9;">${body}</div>`;
      container.appendChild(el);
      setTimeout(() => el.remove(), 4200);
    }

    // Live Canvas ECG Loop for Individual Patient Page
    let detailEcgAnimId = null;
    let detailEcgSweepX = 0;
    let detailEcgPhase = 0;
    let detailEcgTrace = null;

    function startDetailEcgCanvas() {
      const canvas = document.getElementById('detail-ecg-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const W = canvas.width;
      const H = canvas.height;
      if (!detailEcgTrace || detailEcgTrace.length !== W) {
        detailEcgTrace = new Array(W).fill(H * 0.62);
      }

      if (detailEcgAnimId) cancelAnimationFrame(detailEcgAnimId);

      function step() {
        const currentCanvas = document.getElementById('detail-ecg-canvas');
        if (!currentCanvas) return;
        const c = currentCanvas.getContext('2d');
        const p = STATE.patients.find(x => x.patientId === STATE.selectedPatientId) || STATE.patients[0];
        const hr = p?.vitals?.heartRate || 74;
        const status = p?.monitoringStatus || 'NORMAL';

        const bps = Math.max(38, hr) / 60;
        for (let s = 0; s < 3; s++) {
          detailEcgPhase = (detailEcgPhase + bps / 65) % 1.0;
          const pw = 0.15 * Math.exp(-Math.pow(detailEcgPhase - 0.18, 2) / (2 * Math.pow(0.035, 2)));
          const qw = -0.15 * Math.exp(-Math.pow(detailEcgPhase - 0.35, 2) / (2 * Math.pow(0.012, 2)));
          const rw = 1.15 * Math.exp(-Math.pow(detailEcgPhase - 0.38, 2) / (2 * Math.pow(0.010, 2)));
          const sw = -0.28 * Math.exp(-Math.pow(detailEcgPhase - 0.41, 2) / (2 * Math.pow(0.014, 2)));
          const tw = 0.28 * Math.exp(-Math.pow(detailEcgPhase - 0.65, 2) / (2 * Math.pow(0.048, 2)));
          const v = pw + qw + rw + sw + tw + (Math.random() - 0.5) * 0.018;
          detailEcgTrace[detailEcgSweepX] = H * 0.66 - v * (H * 0.46);
          detailEcgSweepX = (detailEcgSweepX + 1) % W;
        }

        c.fillStyle = '#060a12';
        c.fillRect(0, 0, W, H);
        c.strokeStyle = 'rgba(30, 58, 138, 0.22)';
        c.lineWidth = 1;
        for (let gx = 0; gx < W; gx += 24) { c.beginPath(); c.moveTo(gx, 0); c.lineTo(gx, H); c.stroke(); }
        for (let gy = 0; gy < H; gy += 24) { c.beginPath(); c.moveTo(0, gy); c.lineTo(W, gy); c.stroke(); }

        c.strokeStyle = status === 'CRITICAL' ? '#ef4444' : status === 'WARNING' ? '#f59e0b' : '#10b981';
        c.lineWidth = 2;
        c.beginPath();
        for (let i = 0; i < W; i++) {
          if (Math.abs(i - detailEcgSweepX) < 14) continue;
          if (i === 0 || Math.abs(i - 1 - detailEcgSweepX) < 14) c.moveTo(i, detailEcgTrace[i]);
          else c.lineTo(i, detailEcgTrace[i]);
        }
        c.stroke();

        detailEcgAnimId = requestAnimationFrame(step);
      }
      detailEcgAnimId = requestAnimationFrame(step);
    }

    // WebSocket Telemetry Connection
    let ws = null;
    function connectWebSocket() {
      try {
        ws = new WebSocket(WS_ENDPOINT);
        ws.onopen = () => {
          STATE.wsConnected = true;
          renderApp();
        };
        ws.onmessage = (evt) => {
          try {
            const msg = JSON.parse(evt.data);
            if (msg.event === 'INITIAL_SNAPSHOT') {
              STATE.patients = msg.data.patients || STATE.patients;
              STATE.alerts = msg.data.alerts || STATE.alerts;
              STATE.devices = msg.data.devices || STATE.devices;
              if (msg.data.thresholds) STATE.thresholds = msg.data.thresholds;
              renderApp();
            } else if (msg.event === 'VITAL_UPDATE') {
              const d = msg.data;
              const idx = STATE.patients.findIndex(p => p.patientId === d.patientId);
              if (idx !== -1) {
                STATE.patients[idx].vitals = d.vitals;
                STATE.patients[idx].monitoringStatus = d.monitoringStatus;
                STATE.patients[idx].updatedAt = d.timestamp;
                STATE.patients[idx].deviceStatus = 'ONLINE';
              }
              if (STATE.activePage === 'patient-detail' && STATE.selectedPatientId === d.patientId) {
                STATE.patientHistory.push({
                  timestamp: d.timestamp,
                  heartRate: d.vitals.heartRate,
                  spo2: d.vitals.spo2,
                  temperature: d.vitals.temperature,
                  respiratoryRate: d.vitals.respiratoryRate,
                  systolic: d.vitals.bloodPressure.systolic,
                  diastolic: d.vitals.bloodPressure.diastolic
                });
                if (STATE.patientHistory.length > 60) STATE.patientHistory.shift();
              }
              if (!STATE.modalContent) updateLiveDomValues();
            } else if (msg.event === 'ALERT_NEW') {
              const al = msg.data;
              STATE.alerts.unshift(al);
              const p = STATE.patients.find(x => x.patientId === al.patientId);
              if (p) p.activeAlertsCount = (p.activeAlertsCount || 0) + 1;
              if (al.severity === 'CRITICAL') {
                playMedicalAlarm('CRITICAL');
                showToast(`CRITICAL ALARM — ${al.patientName} (${al.bedNumber})`, al.description, 'CRITICAL');
              } else {
                showToast(`WARNING — ${al.patientName} (${al.bedNumber})`, al.description, 'WARNING');
              }
              if (!STATE.modalContent) renderApp();
            } else if (msg.event === 'PATIENT_UPDATED' || msg.event === 'ALERT_UPDATED' || msg.event === 'ALERTS_BULK_ACKNOWLEDGED' || msg.event === 'PATIENT_RECOVERED') {
              fetchAllData();
            } else if (msg.event === 'DEVICE_STATUS') {
              const dev = msg.data;
              const idx = STATE.devices.findIndex(x => x.deviceId === dev.deviceId);
              if (idx !== -1) STATE.devices[idx] = { ...STATE.devices[idx], ...dev };
              const p = STATE.patients.find(x => x.monitoringDeviceId === dev.deviceId);
              if (p) p.deviceStatus = dev.deviceStatus;
              if (!STATE.modalContent && STATE.activePage === 'devices') renderApp();
            }
          } catch (e) {}
        };
        ws.onclose = () => {
          STATE.wsConnected = false;
          setTimeout(connectWebSocket, 2500);
        };
      } catch (e) {}
    }

    async function fetchAllData() {
      try {
        const [pRes, aRes, dRes, tRes, uRes, tkRes, rpRes, audRes] = await Promise.all([
          fetch(`${API_BASE}/patients`).then(r => r.json()),
          fetch(`${API_BASE}/alerts`).then(r => r.json()),
          fetch(`${API_BASE}/devices`).then(r => r.json()),
          fetch(`${API_BASE}/settings/thresholds`).then(r => r.json()),
          fetch(`${API_BASE}/users`).then(r => r.json()),
          fetch(`${API_BASE}/tickets`).then(r => r.json()),
          fetch(`${API_BASE}/reports`).then(r => r.json()),
          fetch(`${API_BASE}/audit-logs`).then(r => r.json()),
        ]);
        STATE.patients = pRes.patients || [];
        STATE.alerts = aRes.alerts || [];
        STATE.devices = dRes.devices || [];
        if (tRes && tRes.heartRate) STATE.thresholds = tRes;
        STATE.users = uRes.users || [];
        STATE.tickets = tkRes.tickets || [];
        STATE.reports = rpRes.reports || [];
        STATE.auditLogs = audRes.auditLogs || [];
        if (!STATE.modalContent) renderApp();
      } catch (e) {}
    }

    async function loadPatientHistory(patientId, hours = 1, startIso = null, endIso = null) {
      try {
        let url = `${API_BASE}/patients/${patientId}/history?hours=${hours}`;
        if (startIso && endIso) {
          url += `&start=${encodeURIComponent(new Date(startIso).toISOString())}&end=${encodeURIComponent(new Date(endIso).toISOString())}`;
        }
        const res = await fetch(url);
        const data = await res.json();
        STATE.patientHistory = data.readings || [];
        renderApp();
      } catch (e) {}
    }

    function initialsOf(name) {
      return (name || 'PT').split(' ').map(s => s[0]).join('').slice(0, 3).toUpperCase();
    }

    function formatTimeAgo(iso) {
      if (!iso) return 'Just now';
      const diffSec = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
      if (diffSec < 10) return 'Live';
      if (diffSec < 60) return `${diffSec}s ago`;
      const mins = Math.floor(diffSec / 60);
      if (mins < 60) return `${mins}m ago`;
      return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function updateLiveDomValues() {
      if (STATE.activePage === 'patient-detail') {
        const p = STATE.patients.find(x => x.patientId === STATE.selectedPatientId) || STATE.patients[0];
        if (!p || !p.vitals) return;
        const v = p.vitals;
        const bp = v.bloodPressure || { systolic: 120, diastolic: 80 };
        const mapVal = Math.round(bp.diastolic + (bp.systolic - bp.diastolic) / 3);
        const stLower = (p.monitoringStatus || 'NORMAL').toLowerCase();

        const elHr = document.getElementById('detail-val-hr');
        const elSpo2 = document.getElementById('detail-val-spo2');
        const elBp = document.getElementById('detail-val-bp');
        const elMap = document.getElementById('detail-val-map');
        const elTemp = document.getElementById('detail-val-temp');
        const elRr = document.getElementById('detail-val-rr');
        const elPill = document.getElementById('detail-acuity-pill');
        const elChart = document.getElementById('detail-trend-chart-wrap');

        if (elHr) elHr.textContent = v.heartRate;
        if (elSpo2) elSpo2.textContent = v.spo2;
        if (elBp) elBp.textContent = `${bp.systolic}/${bp.diastolic}`;
        if (elMap) elMap.textContent = `(${mapVal})`;
        if (elTemp) elTemp.textContent = Number(v.temperature).toFixed(1);
        if (elRr) elRr.textContent = v.respiratoryRate;
        if (elPill) {
          elPill.textContent = p.monitoringStatus;
          elPill.className = `acuity-pill acuity-${stLower}`;
        }
        if (elChart) {
          elChart.innerHTML = buildTrendChartSvg(STATE.patientHistory, STATE.detailChartTab);
        }
        return;
      }

      if (STATE.activePage === 'dashboard') {
        const normalCount = STATE.patients.filter(p => p.monitoringStatus === 'NORMAL').length;
        const warningCount = STATE.patients.filter(p => p.monitoringStatus === 'WARNING').length;
        const criticalCount = STATE.patients.filter(p => p.monitoringStatus === 'CRITICAL').length;
        const elCrit = document.getElementById('census-crit');
        const elWarn = document.getElementById('census-warn');
        const elNorm = document.getElementById('census-norm');
        if (elCrit) elCrit.textContent = criticalCount;
        if (elWarn) elWarn.textContent = warningCount;
        if (elNorm) elNorm.textContent = normalCount;

        STATE.patients.forEach(p => {
          const v = p.vitals || {};
          const bp = v.bloodPressure || { systolic: 120, diastolic: 80 };
          const mapVal = Math.round(bp.diastolic + (bp.systolic - bp.diastolic) / 3);
          const stLower = (p.monitoringStatus || 'NORMAL').toLowerCase();
          const hrAbn = v.heartRate > STATE.thresholds.heartRate.maxNormal || v.heartRate < STATE.thresholds.heartRate.minNormal;
          const spo2Abn = v.spo2 < STATE.thresholds.spo2.minNormal;
          const bpAbn = bp.systolic > 140 || bp.systolic < 90;
          const tempAbn = v.temperature > STATE.thresholds.temperature.maxNormal || v.temperature < STATE.thresholds.temperature.minNormal;
          const rrAbn = v.respiratoryRate > STATE.thresholds.respiratoryRate.maxNormal || v.respiratoryRate < STATE.thresholds.respiratoryRate.minNormal;

          const rHr = document.getElementById(`row-hr-${p.patientId}`);
          const rSpo2 = document.getElementById(`row-spo2-${p.patientId}`);
          const rBp = document.getElementById(`row-bp-${p.patientId}`);
          const rMap = document.getElementById(`row-map-${p.patientId}`);
          const rTemp = document.getElementById(`row-temp-${p.patientId}`);
          const rRr = document.getElementById(`row-rr-${p.patientId}`);
          const rSync = document.getElementById(`row-sync-${p.patientId}`);
          const rSt = document.getElementById(`row-status-${p.patientId}`);
          const rTr = document.getElementById(`row-tr-${p.patientId}`);

          if (rHr) { rHr.textContent = v.heartRate ?? '--'; rHr.className = `vital-cell-num ${hrAbn ? 'val-abnormal' : 'val-normal'}`; }
          if (rSpo2) { rSpo2.textContent = v.spo2 ?? '--'; rSpo2.className = `vital-cell-num ${spo2Abn ? 'val-abnormal' : 'val-normal'}`; }
          if (rBp) { rBp.textContent = `${bp.systolic}/${bp.diastolic}`; rBp.className = `vital-cell-num ${bpAbn ? 'val-abnormal' : 'val-normal'}`; }
          if (rMap) rMap.textContent = `(${mapVal})`;
          if (rTemp) { rTemp.textContent = Number(v.temperature || 36.7).toFixed(1); rTemp.className = `vital-cell-num ${tempAbn ? 'val-abnormal' : 'val-normal'}`; }
          if (rRr) { rRr.textContent = v.respiratoryRate ?? '--'; rRr.className = `vital-cell-num ${rrAbn ? 'val-abnormal' : 'val-normal'}`; }
          if (rSync) rSync.textContent = formatTimeAgo(p.updatedAt);
          if (rSt) {
            rSt.className = `acuity-pill acuity-${stLower}`;
            rSt.innerHTML = `<span class="status-dot ${stLower === 'critical' ? 'dot-crit' : stLower === 'warning' ? 'dot-warn' : 'dot-online'}"></span>${p.monitoringStatus}`;
          }
          if (rTr) rTr.className = `row-${stLower}`;
        });
      }
    }

    async function handleLogin(username, password, role) {
      try {
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, role })
        });
        if (!res.ok) {
          showToast('Authentication Failed', 'Invalid hospital username or password.', 'CRITICAL');
          return;
        }
        const user = await res.json();
        STATE.user = user;
        localStorage.setItem('icu_user', JSON.stringify(user));
        STATE.activePage = 'dashboard';
        await fetchAllData();
      } catch (e) {
        showToast('Connection Error', 'Cloud Backend API on port 8000 is unreachable.', 'CRITICAL');
      }
    }

    function handleLogout() {
      STATE.user = null;
      localStorage.removeItem('icu_user');
      renderApp();
    }

    async function toggleGatewayMaintenance(deviceId, offline) {
      try {
        const res = await fetch(`${API_BASE}/devices/${deviceId}/maintenance`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ offline })
        });
        const data = await res.json();
        if (offline) {
          showToast(`Gateway ${deviceId} Offline Buffer Enabled`, 'Storing bedside telemetry in local SQLite WAL storage.', 'WARNING');
        } else {
          const synced = data.gatewayResponse?.syncedMessages ?? 0;
          showToast(`Gateway ${deviceId} Online`, `Synchronized ${synced} queued SQLite readings to cloud.`);
        }
        await fetchAllData();

    function exportPatientData(patientId) {
      const p = STATE.patients.find(x => x.patientId === patientId) || STATE.patients[0];
      const payload = {
        exportedAt: new Date().toISOString(),
        exportedBy: STATE.user?.fullName || 'Dr. Sarah Smith',
        patient: p,
        recentHistory: STATE.patientHistory
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${p.patientId}_${p.bedNumber}_telemetry_record.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Export Complete', `Downloaded ${p.patientName} clinical telemetry archive.`);
    }

      let filtered = STATE.patients.filter(p => {

        filtered.sort((a, b) => (order[a.monitoringStatus] || 9) - (order[b.monitoringStatus] || 9));

    // SVG Trend Chart Helper
    function buildTrendChartSvg(readings, metricKey) {
      const W = 740, H = 220, padL = 42, padR = 16, padT = 16, padB = 26;
      const pts = (readings && readings.length > 1) ? readings : [
        { timestamp: new Date(Date.now() - 3600000).toISOString(), heartRate: 72, spo2: 98, temperature: 36.6, respiratoryRate: 16, systolic: 120 },
        { timestamp: new Date().toISOString(), heartRate: 74, spo2: 97, temperature: 36.7, respiratoryRate: 17, systolic: 122 }
      ];

      const metaMap = {
        heartRate: { label: 'Heart Rate', unit: 'bpm', min: 50, max: 145, color: '#10b981', field: 'heartRate' },
        spo2: { label: 'SpO₂ Saturation', unit: '%', min: 82, max: 100, color: '#0284c7', field: 'spo2' },
        bloodPressure: { label: 'Systolic NIBP', unit: 'mmHg', min: 75, max: 165, color: '#f97316', field: 'systolic' },
        temperature: { label: 'Core Temperature', unit: '°C', min: 35.5, max: 40.5, color: '#d97706', field: 'temperature' },
        respiratoryRate: { label: 'Respiratory Rate', unit: '/min', min: 8, max: 36, color: '#6366f1', field: 'respiratoryRate' }
      };
      const cfg = metaMap[metricKey] || metaMap.heartRate;
      const values = pts.map(r => Number(r[cfg.field] ?? 75));
      const minY = Math.min(cfg.min, ...values);
      const maxY = Math.max(cfg.max, ...values);

      const coords = values.map((val, idx) => {
        const x = padL + (idx / Math.max(1, values.length - 1)) * (W - padL - padR);
        const y = padT + (1 - (val - minY) / Math.max(1, maxY - minY)) * (H - padT - padB);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      });

      const yTicks = [0, 0.25, 0.5, 0.75, 1].map(t => {
        const val = (maxY - t * (maxY - minY)).toFixed(metricKey === 'temperature' ? 1 : 0);
        const y = padT + t * (H - padT - padB);
        return `
          <line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="var(--border)" stroke-dasharray="3 3" stroke-width="1" />
          <text x="${padL - 8}" y="${y + 4}" text-anchor="end" font-size="10.5" font-family="var(--font-mono)" fill="var(--text-muted)">${val}</text>
        `;
      }).join('');

      return `
        <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:220px;display:block;">
          ${yTicks}
          <polyline fill="none" stroke="${cfg.color}" stroke-width="2" points="${coords.join(' ')}" />
        </svg>
      `;
    }

    function renderAlertsPage() {
      const total = STATE.alerts.length;

      const warnCount = STATE.alerts.filter(a => a.severity === 'WARNING' && !a.resolved).length;
      const unackCount = STATE.alerts.filter(a => !a.acknowledged && !a.resolved).length;
      const activeCount = STATE.alerts.filter(a => !a.resolved).length;

        const matchT = STATE.alertTypeFilter === 'ALL' || a.severity === STATE.alertTypeFilter;
        const matchC = STATE.alertCategoryFilter === 'all' || a.category === STATE.alertCategoryFilter;
        let matchS = true;
        if (STATE.alertStatusFilter === 'active') matchS = !a.resolved;
        else if (STATE.alertStatusFilter === 'unacknowledged') matchS = !a.acknowledged && !a.resolved;
        else if (STATE.alertStatusFilter === 'acknowledged') matchS = a.acknowledged && !a.resolved;
        else if (STATE.alertStatusFilter === 'resolved') matchS = a.resolved;
        return matchQ && matchT && matchC && matchS;

      return `
        <div class="metric-strip">

            <div class="metric-label"><span>Active Warning</span></div>
            <div class="metric-value" style="color:var(--warn-text);">${warnCount}</div>
          </div>

            <div class="metric-label"><span>Total Active</span></div>
            <div class="metric-value">${activeCount}</div>
          </div>
          <div class="metric-cell">
            <div class="metric-label"><span>Historical Log</span></div>
            <div class="metric-value" style="color:var(--text-muted);">${total}</div>
          </div>
        </div>

        <div class="surface-panel">
          <div class="panel-toolbar">
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex:1;">

                     value="${STATE.alertSearch}"
                     oninput="STATE.alertSearch=this.value; renderApp();" />

              <div class="segmented-group">
                <button class="seg-btn ${STATE.alertStatusFilter === 'active' ? 'active' : ''}" onclick="STATE.alertStatusFilter='active';renderApp();">Active (${activeCount})</button>
                <button class="seg-btn ${STATE.alertStatusFilter === 'unacknowledged' ? 'active' : ''}" onclick="STATE.alertStatusFilter='unacknowledged';renderApp();">Unack (${unackCount})</button>
                <button class="seg-btn ${STATE.alertStatusFilter === 'acknowledged' ? 'active' : ''}" onclick="STATE.alertStatusFilter='acknowledged';renderApp();">Ack</button>
                <button class="seg-btn ${STATE.alertStatusFilter === 'resolved' ? 'active' : ''}" onclick="STATE.alertStatusFilter='resolved';renderApp();">Resolved</button>
                <button class="seg-btn ${STATE.alertStatusFilter === 'all' ? 'active' : ''}" onclick="STATE.alertStatusFilter='all';renderApp();">All</button>
              </div>
            </div>

            <div style="display:flex;align-items:center;gap:8px;">
              <select class="input" style="width:auto;padding:5px 10px;font-size:12px;" onchange="STATE.alertTypeFilter=this.value; renderApp();">
                <option value="ALL" ${STATE.alertTypeFilter === 'ALL' ? 'selected' : ''}>All Severities</option>
                <option value="CRITICAL" ${STATE.alertTypeFilter === 'CRITICAL' ? 'selected' : ''}>Critical Only</option>
                <option value="WARNING" ${STATE.alertTypeFilter === 'WARNING' ? 'selected' : ''}>Warning Only</option>

                ${ICONS.check}<span>Acknowledge All (${unackCount})</span>
              </button>
            </div>
          </div>

          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th>Priority</th>
                  <th>Bed & Patient</th>
                  <th>Severity</th>
                  <th>Domain</th>
                  <th>Clinical Alarm Condition</th>
                  <th>Measured vs. Limit</th>
                  <th>Triggered</th>
                  <th>State</th>
                  <th style="text-align:right;">Disposition</th>
                </tr>
              </thead>
              <tbody>
                ${filtered.map(a => {
                  const sevLower = a.severity.toLowerCase();
                  return `
                    <tr class="row-${sevLower} ${!a.acknowledged && !a.resolved ? 'alert-unack' : ''}">
                      <td class="tabular" style="font-weight:700;">P${a.priority}</td>
                      <td>
                        <span class="mono-tag" style="margin-right:6px;">${a.bedNumber}</span>
                        <strong style="cursor:pointer;" onclick="openPatientMonitor('${a.patientId}')">${a.patientName}</strong>
                      </td>
                      <td><span class="acuity-pill acuity-${sevLower}">${a.severity}</span></td>
                      <td><span class="mono-tag">${a.category}</span></td>
                      <td>
                        <span style="font-weight:600;">${a.description}</span>
                        ${a.recoveredAt ? `<span class="acuity-pill acuity-normal" style="margin-left:6px;">RECOVERED</span>` : ''}
                      </td>
                      <td class="tabular">

                      </td>

                      <td>

              </tbody>
            </table>
          </div>
        </div>

        </div>

        <div class="subnav-bar">
          <button class="subnav-tab ${STATE.deviceTab === 'overview' ? 'active' : ''}" onclick="STATE.deviceTab='overview';renderApp();">Gateway Fleet Inventory</button>
          <button class="subnav-tab ${STATE.deviceTab === 'health' ? 'active' : ''}" onclick="STATE.deviceTab='health';renderApp();">SoC Thermal & SQLite Queue</button>
          <button class="subnav-tab ${STATE.deviceTab === 'network' ? 'active' : ''}" onclick="STATE.deviceTab='network';renderApp();">MQTT/TLS & LAN Interfaces</button>
          <button class="subnav-tab ${STATE.deviceTab === 'diagnostics' ? 'active' : ''}" onclick="runGatewayDiagnostics('ICU-PI-001');">Live Hardware Diagnostics</button>
        </div>

        <div class="surface-panel">
          <div class="panel-toolbar">
            <div style="display:flex;align-items:center;gap:10px;flex:1;">
              <input class="input" style="max-width:250px;padding:6px 10px;font-size:12.5px;"
                     placeholder="Filter gateways by ID, IP, or bed..."
                     value="${STATE.deviceSearch}" oninput="STATE.deviceSearch=this.value; renderApp();" />
              <select class="input" style="width:auto;padding:5px 10px;font-size:12px;" onchange="STATE.deviceStatusFilter=this.value; renderApp();">
                <option value="ALL">All States</option>
                <option value="ONLINE">Online</option>
                <option value="OFFLINE">Offline</option>
                <option value="MAINTENANCE">Maintenance</option>
              </select>
            </div>
            <div style="display:flex;gap:8px;">
              <button class="btn btn-xs" onclick="fetchAllData()">Refresh Telemetry</button>
              <button class="btn btn-xs btn-primary" onclick="openRegisterDeviceModal()">
                ${ICONS.plus}<span>Register Gateway</span>
              </button>
            </div>
          </div>

          ${STATE.deviceTab === 'overview' ? `
            <div class="table-scroll">
              <table>
                <thead>
                  <tr>
                    <th>Node ID</th>
                    <th>Bed</th>
                    <th>Gateway Label & Ward</th>
                    <th>LAN IPv4</th>
                    <th>Link State</th>
                    <th>Uptime</th>
                    <th>Firmware</th>
                    <th>Last Heartbeat</th>
                    <th style="text-align:right;">Operations</th>
                  </tr>
                </thead>
                <tbody>
                  ${filtered.map(d => `
                    <tr>
                      <td class="tabular"><strong>${d.deviceId}</strong></td>
                      <td><span class="mono-tag">${d.bedNumber}</span></td>
                      <td>
                        <div style="font-weight:600;">${d.deviceName}</div>
                        <div style="font-size:11.5px;color:var(--text-muted);">${d.location}</div>
                      </td>
                      <td class="tabular">${d.ipAddress}</td>
                      <td>
                        <span class="acuity-pill ${d.deviceStatus === 'ONLINE' ? 'acuity-normal' : d.deviceStatus === 'OFFLINE' ? 'acuity-critical' : 'acuity-warning'}">
                          ${d.deviceStatus}
                        </span>
                      </td>
                      <td class="tabular">${d.uptime}</td>
                      <td><span class="mono-tag">${d.firmwareVersion}</span></td>
                      <td class="tabular" style="color:var(--text-muted);">${formatTimeAgo(d.lastSeen)}</td>
                      <td style="text-align:right;">
                        <div style="display:inline-flex;gap:6px;">
                          <button class="btn btn-xs" onclick="runGatewayDiagnostics('${d.deviceId}')">Diagnose</button>
                          <button class="btn btn-xs ${d.deviceStatus === 'OFFLINE' ? 'btn-primary' : ''}"
                                  onclick="toggleGatewayMaintenance('${d.deviceId}', ${d.deviceStatus === 'ONLINE'})">
                            ${d.deviceStatus === 'ONLINE' ? 'Test Offline Buffer' : 'Restore Online'}
                          </button>
                        </div>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          ` : STATE.deviceTab === 'health' ? `
            <div class="table-scroll">
              <table>
                <thead>
                  <tr>
                    <th>Node ID</th>
                    <th>Acquisition Mode</th>
                    <th>SoC Core Temp</th>
                    <th>CPU Utilization</th>
                    <th>Memory Used</th>
                    <th>SQLite WAL Buffer</th>
                    <th style="text-align:right;">Buffer Sync</th>
                  </tr>
                </thead>
                <tbody>
                  ${filtered.map(d => `
                    <tr>
                      <td class="tabular"><strong>${d.deviceId}</strong> (${d.bedNumber})</td>
                      <td><span class="mono-tag">${d.operatingMode}</span></td>
                      <td class="tabular" style="font-weight:700;color:${(d.cpuTempC || 43) > 55 ? 'var(--crit-text)' : 'var(--normal-text)'};">${Number(d.cpuTempC || 43.2).toFixed(1)} °C</td>
                      <td class="tabular">${Number(d.cpuUsagePct || 14.0).toFixed(1)}%</td>
                      <td class="tabular">${Number(d.memoryUsagePct || 33.5).toFixed(1)}%</td>
                      <td class="tabular"><span class="acuity-pill ${d.offlineQueueSize > 0 ? 'acuity-warning' : 'acuity-normal'}">${d.offlineQueueSize || 0} frames</span></td>
                      <td style="text-align:right;"><button class="btn btn-xs" onclick="flushGatewayQueue('${d.deviceId}')">Flush Queue</button></td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          ` : STATE.deviceTab === 'network' ? `
            <div class="table-scroll">
              <table>
                <thead>
                  <tr>
                    <th>Node ID</th>
                    <th>Bedside LAN IPv4</th>
                    <th>Hardware MAC</th>
                    <th>Upstream Transport</th>
                    <th>Cloud RTT</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody>
                  ${filtered.map(d => `
                    <tr>
                      <td class="tabular"><strong>${d.deviceId}</strong></td>
                      <td class="tabular">${d.ipAddress}</td>
                      <td class="tabular">${d.macAddress || 'DC:A6:32:4F:11:01'}</td>
                      <td class="tabular">MQTT v3.1.1 / TLSv1.2 (8883)</td>
                      <td class="tabular" style="font-weight:700;">${d.deviceStatus === 'ONLINE' ? `${Number(d.latencyMs || 4.2).toFixed(1)} ms` : 'TIMEOUT'}</td>
                      <td><span class="acuity-pill ${d.deviceStatus === 'ONLINE' ? 'acuity-normal' : 'acuity-critical'}">${d.deviceStatus}</span></td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          ` : `
            <div style="padding:18px;">
              ${!STATE.liveDiagnostics ? `<div style="color:var(--text-muted);">Probing edge gateway hardware buses...</div>` : `
                <div class="metric-strip" style="margin-bottom:16px;">
                  <div class="metric-cell">
                    <div class="metric-label">SoC Thermal / CPU</div>
                    <div class="metric-value" style="font-size:18px;">${STATE.liveDiagnostics.hostMetrics?.cpuTempC}°C • ${STATE.liveDiagnostics.hostMetrics?.cpuUsagePct}%</div>
                  </div>
                  <div class="metric-cell">
                    <div class="metric-label">I2C / 1-Wire / SPI</div>
                    <div class="metric-value" style="font-size:13px;margin-top:6px;">${STATE.liveDiagnostics.sensorBusStatus?.MAX30102_I2C}</div>
                  </div>
                  <div class="metric-cell">
                    <div class="metric-label">Upstream RTT</div>
                    <div class="metric-value" style="font-size:18px;">${STATE.liveDiagnostics.network?.rttLatencyMs ?? '--'} ms</div>
                  </div>
                  <div class="metric-cell">
                    <div class="metric-label">Frames Published</div>
                    <div class="metric-value" style="font-size:18px;">${STATE.liveDiagnostics.network?.messagesPublished}</div>
                  </div>
                </div>
                <div style="font-size:12px;font-weight:700;margin-bottom:6px;color:var(--text-secondary);">Edge Gateway System Log Tail (gateway.log):</div>
                <pre class="tabular" style="background:#060a12;color:#34d399;padding:12px;border-radius:6px;font-size:11.5px;overflow-x:auto;max-height:210px;border:1px solid #1e293b;">${(STATE.liveDiagnostics.recentLogs || ['No log entries']).join('\n')}</pre>
              `}
            </div>
          `}
        </div>
      `;
    }

    // PAGE 7: STATION SETTINGS
    async function saveThresholdSettings() {
      const res = await fetch(`${API_BASE}/settings/thresholds`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...STATE.thresholds, actor: STATE.user?.fullName || 'Clinical Admin' })
      });
      STATE.thresholds = await res.json();
      STATE.unsavedSettings = false;
      showToast('Thresholds Saved', 'Alarm limits synchronized with Cloud Evaluation Engine.');
      await fetchAllData();
    }

    async function resetThresholdSettings() {
      const res = await fetch(`${API_BASE}/settings/thresholds/reset`, { method: 'POST' });
      STATE.thresholds = await res.json();
      STATE.unsavedSettings = false;
      showToast('Defaults Restored', 'Alarm limits reset to clinical baseline.');
      await fetchAllData();
    }

    async function handlePasswordChange(form) {
      if (form.newPass.value !== form.confirmPass.value) {
        showToast('Password Mismatch', 'Confirmation password does not match.', 'CRITICAL');
        return;
      }
      await fetch(`${API_BASE}/auth/change-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: STATE.user?.userId || 'USR-001', newPassword: form.newPass.value })
      });
      form.reset();
      showToast('Credentials Updated', 'PBKDF2-SHA256 password hash rotated.');
    }

    function renderSettingsPage() {
      const t = STATE.thresholds;
      return `
        <div class="subnav-bar">
          <button class="subnav-tab ${STATE.settingsTab === 'thresholds' ? 'active' : ''}" onclick="STATE.settingsTab='thresholds';renderApp();">Clinical Alarm Limits</button>
          <button class="subnav-tab ${STATE.settingsTab === 'notifications' ? 'active' : ''}" onclick="STATE.settingsTab='notifications';renderApp();">Acoustic & Visual Escalation</button>
          <button class="subnav-tab ${STATE.settingsTab === 'privacy' ? 'active' : ''}" onclick="STATE.settingsTab='privacy';renderApp();">Security & HIPAA Audit Trail</button>
          <button class="subnav-tab ${STATE.settingsTab === 'system' ? 'active' : ''}" onclick="STATE.settingsTab='system';renderApp();">Cloud & Edge Endpoints</button>
        </div>

        ${STATE.settingsTab === 'thresholds' ? `
          <div class="surface-panel">
            <div class="panel-toolbar">
              <span class="panel-title">Global ICU Alarm Threshold Matrix</span>
              <div style="display:flex;gap:8px;align-items:center;">
                ${STATE.unsavedSettings ? `<span class="acuity-pill acuity-warning">UNSAVED EDITS</span>` : ''}
                <button class="btn btn-xs" onclick="resetThresholdSettings()">Reset Baseline</button>
                <button class="btn btn-xs btn-primary" onclick="saveThresholdSettings()">Save & Sync Thresholds</button>
              </div>
            </div>
            <div style="padding:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;">
              <div style="border:1px solid var(--border);border-radius:6px;padding:14px;">
                <div style="font-weight:700;font-size:13px;margin-bottom:10px;">Heart Rate Limits (BPM)</div>
                <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;">
                  <div class="field"><label>Lower Warn</label><input type="number" class="input tabular" value="${t.heartRate.minNormal}" onchange="STATE.thresholds.heartRate.minNormal=Number(this.value);STATE.unsavedSettings=true;renderApp();" /></div>
                  <div class="field"><label>Upper Warn</label><input type="number" class="input tabular" value="${t.heartRate.maxNormal}" onchange="STATE.thresholds.heartRate.maxNormal=Number(this.value);STATE.unsavedSettings=true;renderApp();" /></div>
                  <div class="field"><label>Upper Crit</label><input type="number" class="input tabular" value="${t.heartRate.criticalHigh}" onchange="STATE.thresholds.heartRate.criticalHigh=Number(this.value);STATE.unsavedSettings=true;renderApp();" /></div>
                </div>
              </div>

              <div style="border:1px solid var(--border);border-radius:6px;padding:14px;">
                <div style="font-weight:700;font-size:13px;margin-bottom:10px;">Arterial SpO₂ & Core Temp</div>
                <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;">
                  <div class="field"><label>SpO₂ Warn (%)</label><input type="number" class="input tabular" value="${t.spo2.minNormal}" onchange="STATE.thresholds.spo2.minNormal=Number(this.value);STATE.unsavedSettings=true;renderApp();" /></div>
                  <div class="field"><label>SpO₂ Crit (%)</label><input type="number" class="input tabular" value="${t.spo2.criticalLow}" onchange="STATE.thresholds.spo2.criticalLow=Number(this.value);STATE.unsavedSettings=true;renderApp();" /></div>
                  <div class="field"><label>Max Temp (°C)</label><input type="number" step="0.1" class="input tabular" value="${t.temperature.maxNormal}" onchange="STATE.thresholds.temperature.maxNormal=Number(this.value);STATE.unsavedSettings=true;renderApp();" /></div>
                </div>
              </div>

              <div style="border:1px solid var(--border);border-radius:6px;padding:14px;">
                <div style="font-weight:700;font-size:13px;margin-bottom:10px;">NIBP & Respiratory Rate</div>
                <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;">
                  <div class="field"><label>Sys Min</label><input type="number" class="input tabular" value="${t.bloodPressure.systolicMin}" onchange="STATE.thresholds.bloodPressure.systolicMin=Number(this.value);STATE.unsavedSettings=true;renderApp();" /></div>
                  <div class="field"><label>Sys Max</label><input type="number" class="input tabular" value="${t.bloodPressure.systolicMax}" onchange="STATE.thresholds.bloodPressure.systolicMax=Number(this.value);STATE.unsavedSettings=true;renderApp();" /></div>
                  <div class="field"><label>Resp Max (/m)</label><input type="number" class="input tabular" value="${t.respiratoryRate.maxNormal}" onchange="STATE.thresholds.respiratoryRate.maxNormal=Number(this.value);STATE.unsavedSettings=true;renderApp();" /></div>
                </div>
              </div>
            </div>
          </div>
        ` : STATE.settingsTab === 'notifications' ? `
          <div class="surface-panel" style="padding:18px;max-width:620px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
              <div>
                <div style="font-weight:700;">IEC 60601-1-8 Acoustic Alarm Synthesizer</div>
                <div style="font-size:12px;color:var(--text-muted);">Play multi-tone audio alert on unacknowledged critical threshold breaches</div>
              </div>
              <label class="switch">
                <input type="checkbox" ${STATE.soundEnabled ? 'checked' : ''} onchange="STATE.soundEnabled=this.checked;renderApp();" />
                <span class="slider"></span>
              </label>
            </div>
            <div class="field">
              <label>Master Alarm Gain (${STATE.soundVolume}%)</label>
              <input type="range" min="0" max="100" value="${STATE.soundVolume}" style="width:100%;" oninput="STATE.soundVolume=Number(this.value);renderApp();" />
            </div>
            <button class="btn btn-xs" onclick="playMedicalAlarm('CRITICAL')">Test Critical Acoustic Sequence</button>
          </div>
        ` : STATE.settingsTab === 'privacy' ? `
          <div style="display:grid;grid-template-columns:340px 1fr;gap:16px;">
            <div class="surface-panel" style="padding:18px;">
              <div style="font-weight:700;font-size:13.5px;margin-bottom:12px;">Rotate Clinician Password</div>
              <form onsubmit="event.preventDefault(); handlePasswordChange(this);">
                <div class="field"><label>Active Operator</label><input class="input" value="${STATE.user?.fullName} (${STATE.user?.role})" disabled /></div>
                <div class="field"><label>New Password</label><input type="password" class="input" name="newPass" required /></div>
                <div class="field"><label>Confirm Password</label><input type="password" class="input" name="confirmPass" required /></div>
                <button type="submit" class="btn btn-primary" style="width:100%;">Update PBKDF2 Hash</button>
              </form>
            </div>
            <div class="surface-panel">
              <div class="panel-toolbar"><span class="panel-title">Immutable Clinical & Security Audit Trail</span></div>
              <div class="table-scroll" style="max-height:360px;overflow-y:auto;">
                <table>
                  <thead><tr><th>Timestamp</th><th>Operator</th><th>Event</th><th>Entity</th><th>Details</th></tr></thead>
                  <tbody>
                    ${STATE.auditLogs.map(log => `
                      <tr>
                        <td class="tabular" style="font-size:11.5px;color:var(--text-muted);">${new Date(log.timestamp).toLocaleTimeString()}</td>
                        <td><strong>${log.actor}</strong></td>
                        <td><span class="mono-tag">${log.action}</span></td>
                        <td class="tabular" style="font-size:12px;">${log.targetId}</td>
                        <td style="font-size:12px;">${log.details}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        ` : `
          <div class="surface-panel" style="padding:18px;">
            <div style="font-weight:700;font-size:13.5px;margin-bottom:14px;">Cloud & Edge Telemetry Endpoints</div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
              <div class="field"><label>AWS IoT Core MQTT Broker</label><input class="input tabular" value="iot.us-east-1.amazonaws.com:8883 (TLSv1.2 X.509)" readonly /></div>
              <div class="field"><label>Real-Time WebSocket Stream</label><input class="input tabular" value="${WS_ENDPOINT}" readonly /></div>
              <div class="field"><label>REST API Endpoint</label><input class="input tabular" value="${API_BASE}" readonly /></div>
              <div class="field"><label>Deduplication & Cooldown Window</label><input class="input tabular" value="30 Days TTL • Cooldown: ${t.cooldownSeconds}s" readonly /></div>
            </div>
          </div>
        `}
      `;
    }

    // PAGE 8: BIOMEDICAL SUPPORT
    async function handleTicketSubmit(form) {
      await fetch(`${API_BASE}/tickets`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          subject: form.subject.value,
          priority: form.priority.value,
          category: form.category.value,
          description: form.description.value,
          createdBy: STATE.user?.fullName || 'Dr. Sarah Smith'
        })
      });
      showToast('Work Order Logged', 'Dispatched to Clinical Biomedical Engineering.');
      STATE.helpTab = 'tickets';
      await fetchAllData();
    }

    async function resolveSupportTicket(ticketId) {
      await fetch(`${API_BASE}/tickets/${ticketId}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: 'RESOLVED' })
      });
      showToast('Work Order Closed', `Ticket #${ticketId} marked RESOLVED.`);
      await fetchAllData();
    }

    function renderHelpPage() {
      return `
        <div style="display:grid;grid-template-columns:360px 1fr;gap:16px;">
          <div class="surface-panel" style="padding:18px;">
            <div style="font-weight:700;font-size:13.5px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border);">
              Log Clinical Engineering Work Order
            </div>
            <form onsubmit="event.preventDefault(); handleTicketSubmit(this);">
              <div class="field"><label>Issue Summary</label><input class="input" name="subject" placeholder="e.g., SpO2 optical probe calibration on ICU-02" required /></div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                <div class="field"><label>Urgency</label><select class="input" name="priority"><option>Medium</option><option>High</option><option>Low</option></select></div>
                <div class="field"><label>Subsystem</label><select class="input" name="category"><option>Hardware</option><option>Technical</option><option>Network</option></select></div>
              </div>
              <div class="field"><label>Technical Details</label><textarea class="input" rows="3" name="description" placeholder="Include bed number, gateway ID, and observed symptom..." required></textarea></div>
              <button type="submit" class="btn btn-primary" style="width:100%;">Dispatch Work Order</button>
            </form>
          </div>

          <div class="surface-panel">
            <div class="panel-toolbar"><span class="panel-title">Active Biomedical Work Orders (${STATE.tickets.length})</span></div>
            <div class="table-scroll">
              <table>
                <thead><tr><th>Ticket</th><th>Summary & Details</th><th>Subsystem</th><th>Urgency</th><th>Status</th><th style="text-align:right;">Action</th></tr></thead>
                <tbody>
                  ${STATE.tickets.map(t => `
                    <tr>
                      <td class="tabular"><span class="mono-tag">#${t.ticketId}</span></td>
                      <td style="white-space:normal;max-width:360px;">
                        <div style="font-weight:600;">${t.subject}</div>
                        <div style="font-size:12px;color:var(--text-muted);">${t.description}</div>
                      </td>
                      <td><span class="mono-tag">${t.category}</span></td>
                      <td><span class="acuity-pill ${t.priority === 'HIGH' ? 'acuity-critical' : 'acuity-warning'}">${t.priority}</span></td>
                      <td><span class="acuity-pill ${t.status === 'RESOLVED' ? 'acuity-normal' : 'acuity-offline'}">${t.status}</span></td>
                      <td style="text-align:right;">
                        ${t.status !== 'RESOLVED' ? `<button class="btn btn-xs" onclick="resolveSupportTicket('${t.ticketId}')">Close</button>` : '—'}
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    let lastRenderedPage = null;
    function renderApp() {
      const root = document.getElementById('app-root');
      if (!root) return;

      const pageChanged = lastRenderedPage !== STATE.activePage;
      const savedWindowScrollY = pageChanged ? 0 : window.scrollY;
      lastRenderedPage = STATE.activePage;

      if (!STATE.user) {
        root.innerHTML = renderLogin();
        return;
      }

      let pageHtml = '';
      if (STATE.activePage === 'dashboard') pageHtml = renderDashboardPage();
      else if (STATE.activePage === 'patient-detail') pageHtml = renderPatientDetailPage();
      else if (STATE.activePage === 'alerts') pageHtml = renderAlertsPage();
      else if (STATE.activePage === 'reports') pageHtml = renderReportsPage();
      else if (STATE.activePage === 'users') pageHtml = renderUsersPage();
      else if (STATE.activePage === 'devices') pageHtml = renderDevicesPage();
      else if (STATE.activePage === 'settings') pageHtml = renderSettingsPage();
      else if (STATE.activePage === 'help') pageHtml = renderHelpPage();

      root.innerHTML = `
        <div class="app-layout">
          ${renderSidebar()}
          <div class="workspace">
            ${renderTopBar()}
            <main class="content-area">
              ${pageHtml}
            </main>
          </div>
        </div>
        ${STATE.modalContent ? `
          <div class="modal-backdrop">
            <div class="modal-card">${STATE.modalContent}</div>
          </div>
        ` : ''}
      `;

      window.scrollTo(0, savedWindowScrollY);

      if (STATE.activePage === 'patient-detail') {
        startDetailEcgCanvas();
      }
    }

    renderApp();
    fetchAllData();
    connectWebSocket();
  </script>
</body>
</html>
